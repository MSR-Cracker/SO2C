name: decompile

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SO2C analysis
        run: |
          PYTHONPATH=src python -m so2c input/lib.so -o output

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: so2c-output
          path: output/
          if-no-files-found: error
